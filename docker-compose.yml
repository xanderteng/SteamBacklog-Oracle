version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: steam-oracle-db
    environment:
      POSTGRES_DB: steambacklog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: